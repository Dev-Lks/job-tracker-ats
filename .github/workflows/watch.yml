name: Monitor Telegram (backup na nuvem)
# Manda as melhores vagas no Telegram a cada 6h. Aprovação com botões ✅/❌
# acontece no watch 24/7 local; aqui é só o empurrão periódico.
# Requer secrets: TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (repo Settings → Secrets).
# Opcional BR: ADZUNA_APP_ID + ADZUNA_APP_KEY (chave grátis em developer.adzuna.com).
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: ${{ secrets.TELEGRAM_BOT_TOKEN == '' || secrets.TELEGRAM_CHAT_ID == '' }}
        run: echo "Sem secrets do Telegram — pulando (configure em Settings → Secrets)." && exit 0
      - if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scripts/watch.mjs --once
