name: Scrape vagas

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      keywords:
        description: "Sobrescreve keywords (separadas por vírgula; vazio = usa o config)"
        required: false
        default: ""
      remote_only:
        description: "Só vagas remotas"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      limit:
        description: "Máximo de vagas no JSON"
        required: false
        default: "100"

permissions:
  contents: write

env:
  SCRAPE_KEYWORDS: ${{ inputs.keywords }}
  SCRAPE_REMOTE_ONLY: ${{ inputs.remote_only }}
  SCRAPE_LIMIT: ${{ inputs.limit }}
  ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
  ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/scrape.mjs
      - name: Commit data/auto-jobs.json se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto-jobs.json
          if ! git diff --quiet --cached; then
            git commit -m "chore: atualiza vagas automáticas"
            git push
          else
            echo "sem mudanças em data/auto-jobs.json"
          fi
